apiVersion: v3.0.2
kind: DataContract
id: reference.categories
version: 1.0.0
status: draft
description:
  purpose: >
    Shared product category reference, delivered as a full snapshot file whenever it changes.
    Not part of the ERP; used by both channels.
  limitations: >
    CAT005 is sent twice with different casing (electronics/All-in-One and Electronics/AllInOne).
    The path column name is to be confirmed (EDA E01); category_path is the working name.
  usage: Read-only. File categories_YYYYMMDD.csv, full snapshot, only on change.
schema:
  - name: categories
    physicalName: inbound/reference/categories
    physicalType: file
    logicalType: object
    description: One row = one category. CSV, UTF-8, comma, RFC 4180, header row.
    properties:
      - name: category_code
        logicalType: string
        physicalType: string
        required: true
        primaryKey: true
        description: Business key; referenced by products.category_code.
      - name: category_path
        logicalType: string
        physicalType: string
        required: false
        description: Category path separated by "/", up to 4 levels, e.g. Electronics/AllInOne.
    quality:
      - type: sql
        description: category_code must be unique within a snapshot.
        query: >
          SELECT COUNT(*) FROM (SELECT upper(trim(category_code)) k FROM ${object}
          GROUP BY upper(trim(category_code)) HAVING COUNT(*) > 1)
        mustBe: 0
        severity: warning
team:
  - username: data-team
    role: owner
support:
  - channel: data-platform
    tool: teams
customProperties:
  - property: loadStrategy
    value: file_new_or_changed
  - property: kind
    value: snapshot
  - property: fileGlob
    value: "*.csv"
  - property: settleMinutes
    value: 5
  - property: deliveryCadence
    value: on_change
  - property: quarantineWarnPct
    value: 2
  - property: quarantineFailPct
    value: 20
  - property: silverTable
    value: slv.categories_history
