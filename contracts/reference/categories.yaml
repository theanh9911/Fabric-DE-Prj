apiVersion: v3.0.2
kind: DataContract
id: reference.categories
version: 1.1.0
status: active
description:
  purpose: >
    Shared product category reference, delivered as a full snapshot file whenever it changes.
    Not part of the ERP; used by both channels.
  limitations: >
    CAT005 is sent twice in the same file with different casing (electronics/All-in-One and
    Electronics/AllInOne). The hierarchy is delivered as four level columns, not as one path.
  usage: Read-only. File categories_YYYYMMDD.csv, full snapshot, only on change.
schema:
  - name: categories
    physicalName: inbound/reference/categories
    physicalType: file
    logicalType: object
    description: One row = one category. CSV, UTF-8, comma, RFC 4180, header row.
    properties:
      - name: category_code
        logicalType: string
        physicalType: string
        required: true
        primaryKey: true
        description: Business key; referenced by products.category_code.
      - name: category_lvl1
        logicalType: string
        physicalType: string
        required: false
        description: Top level of the category hierarchy, e.g. Electronics.
      - name: category_lvl2
        logicalType: string
        physicalType: string
        required: false
        description: Second level; may be empty.
      - name: category_lvl3
        logicalType: string
        physicalType: string
        required: false
        description: Third level; may be empty.
      - name: category_lvl4
        logicalType: string
        physicalType: string
        required: false
        description: Fourth level; may be empty.
      - name: created_at
        logicalType: string
        physicalType: string
        required: false
        description: Creation time as delivered; not used by the platform.
      - name: updated_at
        logicalType: string
        physicalType: string
        required: false
        description: Last change time as delivered; not used by the platform.
    quality:
      - type: sql
        description: category_code must be unique within a snapshot.
        query: >
          SELECT COUNT(*) FROM (SELECT upper(trim(category_code)) k FROM ${object}
          GROUP BY upper(trim(category_code)) HAVING COUNT(*) > 1)
        mustBe: 0
        severity: warning
team:
  - username: data-team
    role: owner
support:
  - channel: data-platform
    tool: teams
customProperties:
  - property: loadStrategy
    value: file_new_or_changed
  - property: kind
    value: snapshot
  - property: fileGlob
    value: "*.csv"
  - property: settleMinutes
    value: 5
  - property: deliveryCadence
    value: on_change
  - property: quarantineWarnPct
    value: 2
  - property: quarantineFailPct
    value: 20
  - property: silverTable
    value: slv.categories_history
