apiVersion: v3.0.2
kind: DataContract
id: retail.sales_hierarchy
version: 1.1.0
status: active
description:
  purpose: Sales organisation of the retail channel, delivered as a full snapshot file whenever it changes.
  limitations: >
    All values are text. salesmanager_code references salesman_code of the same file; some rows
    point to themselves. The creation time column is named inserted_at, as in the ERP.
    Timestamps are assumed to use the same format as retail.orders (yyyy-MM-dd HH:mm:ss).
  usage: Read-only. File sales_hierarchy_YYYYMMDD.csv, full snapshot, only on change.
schema:
  - name: sales_hierarchy
    physicalName: inbound/retail/sales_hierarchy
    physicalType: file
    logicalType: object
    description: One row = one salesman. CSV, UTF-8, comma, RFC 4180, header row.
    properties:
      - name: salesman_code
        logicalType: string
        physicalType: string
        required: true
        primaryKey: true
        description: Business key.
      - name: salesman_name
        logicalType: string
        physicalType: string
        required: false
        description: Salesman name.
      - name: division
        logicalType: string
        physicalType: string
        required: false
        description: Sales division.
      - name: salesmanager_code
        logicalType: string
        physicalType: string
        required: false
        description: Direct manager, references salesman_code.
      - name: salesmanager_name
        logicalType: string
        physicalType: string
        required: false
        description: Manager name copied by the source; not authoritative.
      - name: position
        logicalType: string
        physicalType: string
        required: false
        description: Job title.
      - name: inserted_at
        logicalType: timestamp
        physicalType: string
        required: false
        description: Creation time, local time.
      - name: updated_at
        logicalType: timestamp
        physicalType: string
        required: false
        description: Last change time, local time.
    quality:
      - type: sql
        description: A salesman must not be his own manager.
        query: SELECT COUNT(*) FROM ${object} WHERE upper(trim(salesmanager_code)) = upper(trim(salesman_code))
        mustBe: 0
        severity: warning
team:
  - username: retail-team
    role: owner
support:
  - channel: retail-dataops
    tool: teams
customProperties:
  - property: loadStrategy
    value: file_new_or_changed
  - property: kind
    value: snapshot
  - property: fileGlob
    value: "*.csv"
  - property: settleMinutes
    value: 5
  - property: sourceTimezone
    value: Asia/Ho_Chi_Minh
  - property: timestampFormats
    value: ["yyyy-MM-dd HH:mm:ss"]
  - property: deliveryCadence
    value: on_change
  - property: quarantineWarnPct
    value: 2
  - property: quarantineFailPct
    value: 20
  - property: silverTable
    value: slv.sales_hierarchy_history
