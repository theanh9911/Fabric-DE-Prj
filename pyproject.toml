[project]
name = "companya-de"
version = "0.1.0"
description = "Shared library for the Company A data platform on Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.13"
# Chỉ phụ thuộc thứ Fabric runtime chưa chắc có; pyspark/delta đã có sẵn trên Fabric → để ở nhóm dev
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = [
    # Khớp Fabric Runtime 2.0 (Spark 4.1, Delta 4.2); delta-spark 4.2.0 yêu cầu pyspark <= 4.1.1
    "pyspark==4.1.1",
    "delta-spark==4.2.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companya_de"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
